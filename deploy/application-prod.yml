# 生产配置示例
# 复制为 application-prod.yml 后按需修改；敏感项通过环境变量注入，不要提交真实密码。
# 常用环境变量：
#   DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD
#   REDIS_HOST / REDIS_PORT / REDIS_PASSWORD
#   SERVER_PORT / DRUID_LOGIN_PASSWORD / DRUID_PUBLIC_KEY / KNIFE4J_PASSWORD
#   UPDATE_SERVER_URL

server:
  port: ${SERVER_PORT:82}
spring:
  web:
    resources:
      add-mappings: false
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-request-size: 100MB
      max-file-size: 100MB
  datasource:
    dynamic:
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:runxinyun}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useInformationSchema=true
          username: ${DB_USERNAME:runxinyun}
          password: ${DB_PASSWORD:}
      strict: true
    druid:
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: ${DRUID_LOGIN_PASSWORD:}
      public-key: ${DRUID_PUBLIC_KEY:}
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      validation-query: SELECT 1
      validation-query-timeout: 2000
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      filters: stat
      break-after-acquire-failure: false
      connection-error-retry-attempts: 3
      fail-fast: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 如果数据库不是空表，需要设置成 true，否则启动报错
    baseline-on-migrate: true
    # 与 baseline-on-migrate: true 搭配使用
    baseline-version: 0
    encoding: UTF-8
    # 开发环境最好开启 outOfOrder, 生产环境关闭 outOfOrder .
    out-of-order: false
    # 禁止清理数据库表 生产环境 true
    clean-disabled: true
    # 校验
    validate-on-migrate: true
    init-sql: SET FOREIGN_KEY_CHECKS=0
    backup:
      enabled: false  # 总开关
      skip-empty-db: true  # 是否跳过空数据库
  task:
    scheduling:
      enabled=true:
  data:
    redis:
      database: 1
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0

jackson:
  time-zone: GMT+8
  date-format: yyyy-MM-dd HH:mm:ss
  locale: zh_CN

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    jdbc-type-for-null: null
  global-config:
    banner: false
    enable-sql-runner: true
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: DELETE_FLAG
      logic-delete-value: DELETED
      logic-not-delete-value: NOT_DELETE
  mapper-locations:
    - classpath*:com/rxinyun/*/*/modular/*/mapper/mapping/*.xml
    - classpath*:com/rxinyun/*/*/modular/*/*/mapper/mapping/*.xml

  type-handlers-package: com.rxinyun.common.handler

easy-trans:
  is-enable-redis: true
  is-enable-global: true
  is-enable-tile: true
  is-enable-cloud: false

sa-token:
  token-name: token
  timeout: 3600
  active-timeout: -1
  is-concurrent: true
  is-share: false
  max-login-count: -1
  token-style: random-32
  is-log: false
  is-print: false
  cookie:
    httpOnly: true
    sameSite: Lax
    secure: true
  alone-redis:
    database: 2
    host: ${spring.data.redis.host}
    port: ${spring.data.redis.port}
    password: ${spring.data.redis.password}
    timeout: ${spring.data.redis.timeout}
    lettuce:
      pool:
        max-active: ${spring.data.redis.lettuce.pool.max-active}
        max-wait: ${spring.data.redis.lettuce.pool.max-wait}
        max-idle: ${spring.data.redis.lettuce.pool.max-idle}
        min-idle: ${spring.data.redis.lettuce.pool.min-idle}

knife4j:
  enable: true
  production: false
  basic:
    enable: true
    username: admin
    password: ${KNIFE4J_PASSWORD:}
  setting:
    enableOpenApi: false
    enableSwaggerModels: false
    enableFooter: false
    enableFooterCustom: true
    footerCustomContent: Copyright 2024 RUNXIN
